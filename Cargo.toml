[package]
name = "zcrc-monitor"
version = "0.3.1"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "zcrc_monitor"

[dependencies]
slint = "1.15"
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tonic-web = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"
async-compat = "0.2"
prost-types = "0.14"
chrono = "0.4"
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "line_series", "bitmap_encoder"] }
common = { path = "zaciraci/crates/common" }
bigdecimal = "0.4"
num-traits = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
plotters = { version = "0.3", default-features = false, features = ["ttf"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.15", features = ["backend-android-activity-06"] }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.14"
log = "0.4"

[build-dependencies]
slint-build = "1.15"
tonic-prost-build = "0.14"

[package.metadata.apple]
name = "zcrc-monitor"
bundle-id = "com.example.zcrc-monitor"
